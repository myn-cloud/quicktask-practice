
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickTask</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      padding: 40px 20px;
    }

    .app {
      max-width: 450px;
      margin: auto;
      padding: 25px;
      background: #1e293b;
      border-radius: 16px;
    }

    input, button {
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    input {
      width: 60%;
    }

    button {
      background: #60a5fa;
      cursor: pointer;
    }

    li {
      margin-top: 12px;
      cursor: pointer;
    }

    .done {
      text-decoration: line-through;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>QuickTask</h1>
    <p>Add your tasks and click a task to complete it.</p>

    <input id="taskInput" placeholder="Enter a task">
    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>
  </div>

  <script>
    function addTask() {
      const input = document.getElementById("taskInput");
      const task = input.value.trim();

      if (task === "") {
        alert("Please enter a task!");
        return;
      }

      const item = document.createElement("li");
      item.textContent = task;

      item.onclick = function () {
        item.classList.toggle("done");
      };

      document.getElementById("taskList").appendChild(item);

      input.value = "";
    }
  </script>
</body>
</html>
